{% extends 'base.html' %}{% block content %}<div class="container py-5"><div class="form-card"><h2>Issue a book</h2><form method="post">{% csrf_token %}<label class="form-label">Book</label><select class="form-select mb-3" name="book_id" required>{% for b in books %}<option value="{{ b.pk }}">{{ b.title }} ({{ b.available_copies }} available)</option>{% endfor %}</select><label class="form-label">Member</label><select class="form-select mb-3" name="member_id" required>{% for m in members %}<option value="{{ m.pk }}">{{ m.username }} — {{ m.email }}</option>{% endfor %}</select><button class="btn btn-brand">Issue for 14 days</button></form></div></div>{% endblock %}
